name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The Content Studio's scheduler dispatches this daily and then reads the
  # run: its conclusion becomes this project's "unit tests" tag, and the
  # MONITOR_COVERAGE line the frontend job prints becomes its "coverage %".
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage (gate ≥95%)
        run: pytest

      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: htmlcov/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage (gate ≥95%)
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Frontend coverage"
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                for (const k of ["statements", "branches", "functions", "lines"]) {
                  console.log(`| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`);
                }
              '
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-html
          path: client/coverage/
          if-no-files-found: ignore

      # The line the Content Studio reads back. ONE project maps to ONE
      # percentage, and this repo has two suites — the FRONTEND number is the
      # one reported, deliberately, because it is the half the deployed demo
      # actually is. The backend keeps its own >=95% pytest gate above, which
      # fails the run (and so the "unit tests" tag) independently.
      #
      # `always()` so a failing suite still reports its numbers, and
      # `::notice::` so the line survives as an annotation after the log
      # expires — the studio falls back to reading it that way.
      - name: Report coverage to the studio
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total.lines;
              const out = { pct: t.pct, lines: { covered: t.covered, total: t.total } };
              console.log("::notice title=coverage::MONITOR_COVERAGE " + JSON.stringify(out));
            '
          else
            echo "::notice title=coverage::MONITOR_COVERAGE {\"pct\":null}"
          fi
